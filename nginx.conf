server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always; # index.html embeds app.html in an iframe

  # Filenames are not hashed, so keep static caching short; the service worker handles offline.
  location ~* \.(css|js|png|svg)$ {
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
  }

  # Browsers must always re-check these, or users get stuck on an old version.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
